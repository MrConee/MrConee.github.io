        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #94a3b8;">No se encontraron enfermedades para esta búsqueda.</td></tr>';
                document.getElementById('rowCount').innerText = 'Mostrando 0 enfermedades';
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item['#']}</strong></td>
                    <td><strong>${item['nombre']}</strong></td>
                    <td><span class="badge">${item['rareza']}</span></td>
                    <td>${item['hábitat']}</td>
                    <td><code>${item['mecánica_salvación']}</code></td>
                    <td><div style="margin-bottom:4px;"><strong>Sínt.:</strong> ${item['síntomas']}</div><div><strong>Ef.:</strong> ${item['efectos']}</div></td>
                    <td>${item['tratamiento']}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('rowCount').innerText = `Mostrando ${data.length} de ${diseases.length} enfermedades`;
        }

        function filterTable() {
            const query = document.getElementById('searchZone').value.toLowerCase();
            const filtered = diseases.filter(item => {
                const name = item['nombre'].toLowerCase();
                const habitat = item['hábitat'].toLowerCase();
                const symptoms = item['síntomas'].toLowerCase();
                return name.includes(query) || habitat.includes(query) || symptoms.includes(query);
            });
            renderTable(filtered);
        }

        // Initial render
        renderTable(diseases);
    </script>
